modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''
Redstone-controlled PAW and CEE pantographs for Sable physics trains.
Power raises the collector; losing power lowers it. PAW collectors expose a CEE electrical terminal
and feed real CEE circuits from PAW contact/feed wires or CEE catenary, with Sable pose transforms.
Multi-arm cantilevers expose separate CEE terminals, and inline insulators split conductor sections.
Adds moving contact/departure arc audio. The independent electric motor is now provided by EMU Cab.
'''

[[mixins]]
config="${mod_id}.mixins.json"

